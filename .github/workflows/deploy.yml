name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 using SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo chmod +x /opt/lead-management/deploy.sh
            /opt/lead-management/deploy.sh
            cd /opt/lead-management/backend
            if [ -d "../venv" ]; then
              source ../venv/bin/activate
            elif [ -d "venv" ]; then
              source venv/bin/activate
            elif [ -d "../env" ]; then
              source ../env/bin/activate
            elif [ -d "env" ]; then
              source env/bin/activate
            fi
            pip install -r requirements.txt
            python migrate.py
            sudo systemctl restart lead-backend || pm2 restart all || pm2 restart backend || true

