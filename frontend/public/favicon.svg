<!--
  Connectedus favicon.

  The same mark the app header uses (AppLayout.jsx): a rounded tile in the
  brand primary navy (#003770) carrying a bold white "E". The colour is
  hard-coded rather than read from the stylesheet's primary token, because a
  favicon is loaded outside the document and inherits none of the app's CSS.

  The E is built from rectangles, not a text node. Browser chrome renders a
  favicon with no access to the page's webfonts, so text would fall back to
  whatever the platform happened to have and change shape per OS.

  A solid filled tile is deliberate: it reads against both light and dark
  browser chrome without needing a prefers-color-scheme variant.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Connectedus">
  <rect width="64" height="64" rx="14" fill="#003770"/>
  <g fill="#ffffff">
    <!-- stem -->
    <rect x="17" y="15" width="9" height="34" rx="1.5"/>
    <!-- arms: the middle one is shorter, as in the header wordmark -->
    <rect x="17" y="15" width="30" height="8" rx="1.5"/>
    <rect x="17" y="28" width="24" height="8" rx="1.5"/>
    <rect x="17" y="41" width="30" height="8" rx="1.5"/>
  </g>
</svg>
